[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131F32"
codeBackgroundColor = "#131F32"
textColor = "#F1F5F9"
linkColor = "#2DD4BF"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "6px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#2DD4BF"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = [
    "#2DD4BF",
    "#34D399",
    "#A78BFA",
    "#F87171",
    "#FBBF24",
    "#38BDF8",
    "#94A3B8",
    "#FB923C",
]

chartSequentialColors = [
    "#0C4A6E",
    "#075985",
    "#0369A1",
    "#0284C7",
    "#0EA5E9",
    "#38BDF8",
    "#7DD3FC",
    "#BAE6FD",
    "#E0F2FE",
    "#F0F9FF",
]

dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#131F32"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131F32"
codeBackgroundColor = "#131F32"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#2DD4BF"

[browser]
gatherUsageStats = false
